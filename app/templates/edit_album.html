{% extends "base.html" %}

{% block title %}Edit {{ album.title }} - Album Tracker{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_album.css') }}">
{% endblock %}

{% block content %}
<section class="add-album-container">
  <h1>Edit Album Details</h1>
  <p class="add-album-subtitle">Update the album information.</p>

  <form method="POST" action="{{ url_for('albums.edit_album', album_id=album._id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="title">Album Title</label>
      <input type="text" id="title" name="title" value="{{ album.title }}" required>
    </div>

    <div class="form-group">
      <label for="artist">Artist</label>
      <input type="text" id="artist" name="artist" value="{{ album.artist }}" required>
    </div>

    <div class="form-group">
      <label for="year">Release Year (optional)</label>
      <input type="number" id="year" name="year" min="1900" max="9999" value="{{ album.year if album.year else '' }}">
    </div>

    <button type="submit" class="add-album-button">Save Changes</button>
  </form>

  <p><a href="{{ url_for('albums.view_album', album_id=album._id) }}">Cancel</a></p>
</section>
{% endblock %}
