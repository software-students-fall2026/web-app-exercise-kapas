{% extends "base.html" %}

{% block title %}Delete {{ album.title }} - Album Tracker{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/album_actions.css') }}">
{% endblock %}

{% block content %}

<section class="delete-panel">
    <h1>Delete Album</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ album.title }}</strong>
        by {{ album.artist }}?
    </p>

    <p class="delete-warning">
        This action cannot be undone.
    </p>

    <form method="POST"
          action="{{ url_for('albums.delete_album', album_id=album._id) }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <button type="submit" class="delete-button">
            Delete Album
        </button>
    </form>

    <a class="album-secondary-link"
       href="{{ url_for('albums.view_album', album_id=album._id) }}">
        Cancel
    </a>
</section>

{% endblock %}
